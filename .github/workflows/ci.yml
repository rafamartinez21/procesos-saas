name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Cuando tengas package-lock.json commiteado, puedes cambiar esto por "npm ci".
      - run: npm install
      - run: npm test
